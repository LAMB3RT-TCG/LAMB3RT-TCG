<script>
'use strict';

let prices = [];
let recognition = null;
let dictationSession = false;
let pauseRequested = false;
let sessionBaseText = '';
let finalResultsByIndex = new Map();
let restartTimer = null;

const input = document.getElementById('priceInput');
const status = document.getElementById('status');
const micBtn = document.getElementById('micBtn');

try {
  const saved = JSON.parse(localStorage.getItem('lamb3rt_prices_v1') || '[]');
  if (Array.isArray(saved)) prices = saved.filter(n => typeof n === 'number' && Number.isFinite(n));
} catch (e) {}

function normalizeWords(text) {
  return text.toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[‐-‒–—-]/g, ' ')
    .replace(/\bet\b/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
}

function frenchNumberWordsToNumber(phrase) {
  const s = normalizeWords(phrase);
  if (!s) return null;
  const w = s.split(' ');
  const units = {
    zero:0, un:1, une:1, deux:2, trois:3, quatre:4, cinq:5, six:6,
    sept:7, huit:8, neuf:9, dix:10, onze:11, douze:12, treize:13,
    quatorze:14, quinze:15, seize:16
  };
  const tens = {vingt:20, trente:30, quarante:40, cinquante:50};
  let i = 0, n = 0;

  if (w[i] === 'cent' || w[i] === 'cents') {
    n = 100;
    i++;
  } else if (units[w[i]] !== undefined && w[i+1] === 'cent') {
    n = units[w[i]] * 100;
    i += 2;
  }

  if (w[i] === 'mille') {
    n = (n || 1) * 1000;
    i++;
  }

  if (w[i] === 'quatre' && (w[i+1] === 'vingt' || w[i+1] === 'vingts')) {
    n += 80;
    i += 2;
    if (units[w[i]] !== undefined && units[w[i]] < 10) {
      n += units[w[i]];
      i++;
    } else if (units[w[i]] !== undefined && units[w[i]] >= 10 && units[w[i]] <= 16) {
      n += units[w[i]];
      i++;
    }
  } else if (w[i] === 'soixante') {
    n += 60;
    i++;
    if (w[i] === 'dix') {
      n += 10;
      i++;
    } else if (units[w[i]] !== undefined && units[w[i]] >= 10 && units[w[i]] <= 16) {
      n += units[w[i]];
      i++;
    } else if (units[w[i]] !== undefined && units[w[i]] < 10) {
      n += units[w[i]];
      i++;
    }
  } else if (tens[w[i]] !== undefined) {
    n += tens[w[i]];
    i++;
    if (units[w[i]] !== undefined && units[w[i]] < 10) {
      n += units[w[i]];
      i++;
    }
  } else if (units[w[i]] !== undefined) {
    n += units[w[i]];
    i++;
  }

  return i === w.length ? n : null;
}

function splitFusedPrice(value) {
  const digits = String(value);
  if (!/^\d{4,6}$/.test(digits) || Number(digits) <= 200) return null;

  const candidates = [];
  for (let cut = 2; cut < digits.length; cut++) {
    const left = Number(digits.slice(0, cut));
    const right = Number(digits.slice(cut));

    if (left >= 15 && left <= 200 && right >= 15 && right <= 200) {
      candidates.push([left, right]);
    }
  }

  return candidates.length === 1 ? candidates[0] : null;
}

function parsePrices(text) {
  const raw = text.trim();
  if (!raw) return [];

  const chunks = raw
    .replace(/dollars?|piastres?/gi, ' ')
    .replace(/\$/g, ' ')
    .split(/[;,\n]+/)
    .map(s => s.trim())
    .filter(Boolean);

  const out = [];

  for (const chunk of chunks) {
    const numeric = chunk.match(/^\s*(\d+(?:[.,]\d{1,2})?)\s*$/);

    if (numeric) {
      const token = numeric[1].replace(',', '.');
      const value = Number(token);

      if (Number.isFinite(value) && value >= 0) {
        const split = !token.includes('.') ? splitFusedPrice(token) : null;
        if (split) out.push(...split);
        else out.push(value);
      }
      continue;
    }

    if (/^\s*\d+(?:\s+\d+)+\s*$/.test(chunk)) {
      chunk.match(/\d+/g).forEach(token => out.push(Number(token)));
      continue;
    }

    const numericTokens = chunk.match(/\d+(?:[.,]\d{1,2})?/g);

    if (numericTokens && !/[a-z]/i.test(chunk)) {
      numericTokens.forEach(token => {
        const value = Number(token.replace(',', '.'));
        if (Number.isFinite(value) && value >= 0) out.push(value);
      });
      continue;
    }

    const words = normalizeWords(chunk).split(/\s+/).filter(Boolean);
    let i = 0;

    while (i < words.length) {
      let found = null;
      let end = i;

      for (let j = Math.min(words.length, i + 5); j > i; j--) {
        const value = frenchNumberWordsToNumber(words.slice(i, j).join(' '));

        if (value !== null && value >= 0 && value <= 999999) {
          found = value;
          end = j;
          break;
        }
      }

      if (found !== null) {
        out.push(found);
        i = end;
      } else {
        if (/^\d+(?:[.,]\d{1,2})?$/.test(words[i])) {
          const value = Number(words[i].replace(',', '.'));
          if (Number.isFinite(value)) out.push(value);
        }
        i++;
      }
    }
  }

  return out;
}

function money(n) {
  return Number.isInteger(n)
    ? String(n)
    : n.toLocaleString('fr-CA', {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
}

function savePrices() {
  try {
    localStorage.setItem('lamb3rt_prices_v1', JSON.stringify(prices));
  } catch (e) {}
}

function addFromInput() {
  const parsed = parsePrices(input.value);

  if (!parsed.length) {
    status.textContent = 'Aucun prix détecté. Vérifie le texte.';
    return;
  }

  prices = prices.concat(parsed);
  savePrices();
  input.value = '';
  sessionBaseText = '';
  render();

  status.textContent = `${parsed.length} prix ajoutés; ${prices.length} au total.`;
}

function render() {
  const list = document.getElementById('priceList');
  list.innerHTML = '';

  prices.forEach((price, index) => {
    const chip = document.createElement('div');
    chip.className = 'chip';

    const span = document.createElement('span');
    span.textContent = money(price) + ' $';

    const remove = document.createElement('button');
    remove.type = 'button';
    remove.title = 'Supprimer';
    remove.textContent = '×';
    remove.setAttribute('aria-label', 'Supprimer ' + money(price) + ' dollars');

    remove.addEventListener('click', () => {
      prices.splice(index, 1);
      savePrices();
      render();
    });

    chip.append(span, remove);
    list.appendChild(chip);
  });

  const per = Number(document.getElementById('perLabel').value);
  const labels = document.getElementById('labels');
  labels.innerHTML = '';

  for (let i = 0; i < prices.length; i += per) {
    const label = document.createElement('div');
    label.className = 'label';

    for (let j = 0; j < per; j++) {
      const half = document.createElement('div');
      half.className = 'half';

      if (prices[i+j] !== undefined) {
        const p = document.createElement('span');
        p.className = 'price';
        p.textContent = money(prices[i+j]);

        const c = document.createElement('span');
        c.className = 'currency';
        c.textContent = '$';

        half.append(p, c);
      }

      label.appendChild(half);
    }

    if (per === 1) label.style.gridTemplateColumns = '1fr';
    labels.appendChild(label);
  }

  document.getElementById('summary').textContent = prices.length
    ? `${prices.length} prix · ${Math.ceil(prices.length/per)} étiquette(s)${per===2 && prices.length%2 ? ' · le dernier prix sera seul' : ''}`
    : 'Aucun prix pour le moment.';

  const fs = Math.max(12, Math.min(34, Number(document.getElementById('fontSize').value) || 22));

  document.querySelectorAll('.price').forEach(el => {
    el.style.fontSize = fs + 'pt';
  });
}

/* ===========================
   DICTÉE ANDROID
   =========================== */

function stopSpeech() {
  pauseRequested = true;
  dictationSession = false;

  if (restartTimer) {
    clearTimeout(restartTimer);
    restartTimer = null;
  }

  const current = recognition;
  recognition = null;

  if (current) {
    current.onend = null;
    try {
      current.stop();
    } catch (e) {}
  }

  micBtn.classList.remove('is-active');
  micBtn.title = 'Dicter les prix';
  micBtn.setAttribute('aria-label', 'Dicter les prix');

  document.getElementById('micCaption').textContent = 'Appuie pour dicter';

  status.textContent = 'Pause : le texte reconnu est conservé. Vérifie-le, puis crée la liste ou reprends la dictée.';
}

function startSpeech() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SR) {
    document.getElementById('micCaption').textContent = 'Micro non disponible';
    status.textContent = 'Dictée non prise en charge ici. Essaie dans Chrome sur HTTPS.';
    return;
  }

  if (dictationSession) return;

  pauseRequested = false;
  dictationSession = true;
  sessionBaseText = input.value.trim();

  micBtn.classList.add('is-active');
  micBtn.title = 'Micro actif — appuie sur Pause pour arrêter';
  micBtn.setAttribute('aria-label', 'Micro actif');

  document.getElementById('micCaption').textContent = 'Micro actif';
  status.textContent = 'Micro actif. Dicte tes prix; ils apparaîtront au fur et à mesure.';

  function launchRecognition() {
    if (!dictationSession || pauseRequested) return;

    let current = null;

    try {
      current = new SR();
      recognition = current;

      current.lang = 'fr-CA';
      current.continuous = true;
      current.interimResults = true;
      current.maxAlternatives = 1;

      // Les résultats finaux sont conservés par index.
      // Le texte provisoire est affiché séparément.
      const sessionFinals = new Map();

      current.onresult = event => {
        let interimText = '';

        for (let i = 0; i < event.results.length; i++) {
          const result = event.results[i];
          const transcript = (result && result[0] && result[0].transcript || '').trim();

          if (result.isFinal) {
            if (transcript) {
              sessionFinals.set(i, transcript);
            } else {
              sessionFinals.delete(i);
            }
          } else if (transcript) {
            interimText += (interimText ? ' ' : '') + transcript;
          }
        }

        const finalText = [...sessionFinals.entries()]
          .sort((a, b) => a[0] - b[0])
          .map(x => x[1])
          .join(', ');

        input.value = [
          sessionBaseText,
          finalText,
          interimText
        ].filter(Boolean).join(', ').trim();

        const count = parsePrices(
          [sessionBaseText, finalText].filter(Boolean).join(', ')
        ).length;

        status.textContent =
          `Micro actif · ${count} prix confirmé(s)` +
          (interimText ? ' · reconnaissance en cours…' : '') + '.';
      };

      current.onerror = event => {
        if (event.error && !['no-speech', 'aborted'].includes(event.error)) {
          dictationSession = false;
          pauseRequested = true;

          micBtn.classList.remove('is-active');
          document.getElementById('micCaption').textContent = 'Appuie pour dicter';

          status.textContent =
            'Erreur micro : ' + event.error + '. Le texte reconnu reste visible.';
        }
      };

      current.onend = () => {
        if (recognition !== current) return;

        const finalText = [...sessionFinals.entries()]
          .sort((a, b) => a[0] - b[0])
          .map(x => x[1])
          .join(', ');

        // On ajoute les résultats finaux une seule fois à la base.
        sessionBaseText = [
          sessionBaseText,
          finalText
        ].filter(Boolean).join(', ').trim();

        input.value = sessionBaseText;
        recognition = null;

        if (dictationSession && !pauseRequested) {
          status.textContent = 'Micro actif · reprise automatique de l’écoute…';

          restartTimer = setTimeout(() => {
            restartTimer = null;
            launchRecognition();
          }, 350);
        } else {
          dictationSession = false;

          micBtn.classList.remove('is-active');
          micBtn.title = 'Dicter les prix';
          micBtn.setAttribute('aria-label', 'Dicter les prix');

          document.getElementById('micCaption').textContent = 'Appuie pour dicter';
          status.textContent = 'Micro arrêté. Le texte est conservé.';
        }
      };

      current.start();

    } catch (e) {
      if (recognition === current) recognition = null;

      dictationSession = false;
      pauseRequested = true;

      micBtn.classList.remove('is-active');
      document.getElementById('micCaption').textContent = 'Appuie pour dicter';

      status.textContent = 'Impossible de démarrer le micro. Essaie dans Chrome sur HTTPS.';
    }
  }

  launchRecognition();
}

/* ===========================
   BOUTONS ET ÉVÉNEMENTS
   =========================== */

micBtn.addEventListener('click', startSpeech);

document.getElementById('stopBtn').addEventListener('click', stopSpeech);

document.getElementById('loadBtn').addEventListener('click', addFromInput);
document.getElementById('addBtn').addEventListener('click', addFromInput);

document.getElementById('clearBtn').addEventListener('click', () => {
  prices = [];
  sessionBaseText = '';
  input.value = '';

  savePrices();

  if (restartTimer) {
    clearTimeout(restartTimer);
    restartTimer = null;
  }

  if (recognition) {
    try {
      recognition.onend = null;
      recognition.stop();
    } catch (e) {}
  }

  recognition = null;
  dictationSession = false;
  pauseRequested = true;

  micBtn.classList.remove('is-active');
  micBtn.title = 'Dicter les prix';
  micBtn.setAttribute('aria-label', 'Dicter les prix');

  render();
  status.textContent = 'Liste effacée.';
});

document.getElementById('fontSize').addEventListener('input', render);
document.getElementById('perLabel').addEventListener('change', render);

document.getElementById('printBtn').addEventListener('click', () => {
  if (!prices.length) {
    status.textContent = 'Ajoute des prix avant d’imprimer.';
    return;
  }

  window.print();
});

render();

if ('serviceWorker' in navigator &&
    (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}
</script>
